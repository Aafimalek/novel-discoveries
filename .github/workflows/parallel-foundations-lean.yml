name: Parallel proof foundations
on:
  push:
    paths:
      - 'frankl-height-six/lean/**'
      - 'width-three-posets/lean/**'
      - '.github/workflows/parallel-foundations-lean.yml'
permissions:
  contents: read
concurrency:
  group: foundations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: orthogonal-latin-square-gap/lean
          build: false
          test: false
          lint: false
      - name: Check the Frankl height-two lemma
        working-directory: orthogonal-latin-square-gap/lean
        run: lake env lean ../../frankl-height-six/lean/HeightTwo.lean
      - name: Check the poset swap lemma when present
        if: always()
        working-directory: orthogonal-latin-square-gap/lean
        run: |
          if [ -f ../../width-three-posets/lean/SwapInjection.lean ]; then
            lake env lean ../../width-three-posets/lean/SwapInjection.lean
          fi
