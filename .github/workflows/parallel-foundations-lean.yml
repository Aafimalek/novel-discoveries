name: Parallel proof foundations
on:
  push:
    paths:
      - 'frankl-height-six/lean/**'
      - 'width-three-posets/lean/**'
      - '.github/workflows/parallel-foundations-lean.yml'
permissions:
  contents: read
concurrency:
  group: foundations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: orthogonal-latin-square-gap/lean
          build: false
          test: false
          lint: false
      - name: Check the Frankl height-two lemmas
        working-directory: orthogonal-latin-square-gap/lean
        run: lake env lean ../../frankl-height-six/lean/HeightTwo.lean
      - name: Check the poset certificates
        working-directory: orthogonal-latin-square-gap/lean
        run: |
          work="$(mktemp -d)"
          cp ../../width-three-posets/lean/*.lean "$work/"
          lake env bash -c 'set -eu; cd "$1"; export LEAN_PATH="$1:$LEAN_PATH"; lean -o SwapInjection.olean SwapInjection.lean; lean BranchOrder.lean; lean LayerArithmetic.lean' bash "$work"
